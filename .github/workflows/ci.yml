# Builds and tests every preset family: Linux (Clang, ASan+UBSan, TSan), Windows (MSVC, clang-cl),
# macOS, the iOS simulator, and Android (x86_64 tests on an emulator, arm64 build only).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-clang, linux-clang-asan, linux-clang-tsan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Toolchain (Clang 21, libstdc++ 14, OpenSSL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libssl-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          # TSan needs the default address-space layout.
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j 4 --timeout 600

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc, windows-clang-cl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j 4 --timeout 600

  apple:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: lukka/get-cmake@latest
      - name: "macOS (universal, so Mbed TLS: Homebrew's OpenSSL is arm64 only)"
        run: |
          cmake --preset macos -DRHP_TLS_OPENSSL=OFF
          cmake --build --preset macos
          ctest --preset macos -j 4 --timeout 600
      - name: Boot an iOS simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "RHP_SIM_DEVICE=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: iOS simulator (Mbed TLS)
        run: |
          cmake --preset ios-sim
          cmake --build --preset ios-sim -- -quiet
          ctest --preset ios-sim -j 2 --timeout 900
      - name: iOS device (build only)
        run: |
          cmake --preset ios-device
          cmake --build --preset ios-device -- -quiet

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-android-${{ hashFiles('cmake/Dependencies.cmake') }}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build (x86_64 with tests, arm64 build only)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake --preset android-x64
          cmake --build --preset android-x64
          cmake --preset android-arm64
          cmake --build --preset android-arm64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 Tools/android/run_tests.py build/android-x64
